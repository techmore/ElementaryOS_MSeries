name: M-series SDK developer path

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "rust/msdk/**"
      - "rust/msdk-gtk/**"
      - "rust/claude-pantheon-rs/sdk/**"
      - "rust/mseries-greeter/data/greeter.ui.json"
      - "mseries/sdk-tests/**"
      - "mseries/sdk-bench/**"
      - ".github/workflows/msdk.yml"
  push:
    branches: [dev]
    paths:
      - "rust/msdk/**"
      - "rust/msdk-gtk/**"
      - "mseries/sdk-tests/**"
      - "mseries/sdk-bench/**"
      - ".github/workflows/msdk.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualify:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/work/sdk-target
    steps:
      - uses: actions/checkout@v7
      - name: Provision native SDK test environment
        run: |
          # The Azure mirror took >25 minutes for two Rust archives in run
          # 40355512113. Use official Ubuntu ports with the existing signed trust.
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          import re
          path = Path('/etc/apt/sources.list.d/ubuntu.sources')
          text = path.read_text()
          path.write_text(re.sub(r'(?m)^URIs:.*$', 'URIs: http://ports.ubuntu.com/ubuntu-ports', text))
          PYTHON
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y --no-install-recommends cargo rustc rustfmt rust-clippy \
            build-essential pkg-config libgtk-4-dev libwayland-dev libwayland-bin \
            xvfb xauth dbus-x11 at-spi2-core dpkg-dev desktop-file-utils appstream python3-jsonschema python3-pyatspi python3-dbus xdotool
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            work/sdk-target
          key: msdk-native-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: msdk-native-${{ runner.arch }}-
      - name: Prepare isolated SDK workspace
        run: python3 mseries/sdk-tests/prepare.py "$RUNNER_TEMP/sdk"
      - name: Core tests and strict lint
        run: |
          python3 -m unittest discover -s mseries/sdk-bench -p 'test_*.py'
          cargo fmt --manifest-path "$RUNNER_TEMP/sdk/Cargo.toml" -p msdk --check
          cargo test --manifest-path "$RUNNER_TEMP/sdk/Cargo.toml" -p msdk
          cargo clippy --manifest-path "$RUNNER_TEMP/sdk/Cargo.toml" -p msdk --all-targets -- -D warnings
      - name: Independent schema and checker agreement
        run: python3 mseries/sdk-tests/check-schema.py --msdk "$CARGO_TARGET_DIR/debug/msdk" --rust-root "$RUNNER_TEMP/sdk"
      - name: Build and test generated native application
        run: |
          mkdir -p "$RUNNER_TEMP/sdk-evidence"
          "$CARGO_TARGET_DIR/debug/msdk" new settings "$RUNNER_TEMP/starter" --name 'SDK Settings' --id io.github.techmore.SdkSettings
          "$CARGO_TARGET_DIR/debug/msdk" gen "$RUNNER_TEMP/starter/app.ui.json" "$RUNNER_TEMP/generated" --sdk-root "$RUNNER_TEMP/sdk"
          cargo fmt --manifest-path "$RUNNER_TEMP/generated/Cargo.toml"
          cargo test --manifest-path "$RUNNER_TEMP/generated/Cargo.toml" --all-targets
          cargo clippy --manifest-path "$RUNNER_TEMP/generated/Cargo.toml" --all-targets -- -D warnings
          for mode in light dark; do
            theme=Adwaita
            if [ "$mode" = dark ]; then theme=Adwaita:dark; fi
            GTK_THEME="$theme" GSK_RENDERER=cairo xvfb-run -a dbus-run-session -- \
              "$CARGO_TARGET_DIR/debug/msdk-sdksettings" --screenshot "$RUNNER_TEMP/sdk-evidence/settings-$mode.png"
          done
          cp "$RUNNER_TEMP/sdk/Cargo.lock" "$RUNNER_TEMP/sdk-evidence/sdk-Cargo.lock"
          cp "$RUNNER_TEMP/generated/Cargo.lock" "$RUNNER_TEMP/sdk-evidence/generated-Cargo.lock"
          git rev-parse HEAD > "$RUNNER_TEMP/sdk-evidence/source.txt"
          sha256sum "$CARGO_TARGET_DIR/debug/msdk-sdksettings" > "$RUNNER_TEMP/sdk-evidence/binary.sha256"
      - name: Actual keyboard and accessibility controls
        run: |
          MSDK_PRIVATE_TEST_BUS=1 GSK_RENDERER=cairo xvfb-run -a dbus-run-session -- \
            python3 mseries/sdk-tests/controls.py --binary "$CARGO_TARGET_DIR/debug/msdk-sdksettings" --output "$RUNNER_TEMP/sdk-evidence/controls.json"
      - name: Compact and larger-text render matrix
        run: bash mseries/sdk-tests/render-matrix.sh "$CARGO_TARGET_DIR/debug/msdk-sdksettings" "$RUNNER_TEMP/sdk-evidence/matrix"
      - name: Native host lifecycle
        run: |
          cargo clippy --manifest-path "$RUNNER_TEMP/sdk/Cargo.toml" -p msdk-gtk --all-targets -- -D warnings
          MSDK_PRIVATE_TEST_BUS=1 XDG_DATA_HOME="$RUNNER_TEMP/sdk-state" GSK_RENDERER=cairo xvfb-run -a dbus-run-session -- \
            cargo test --manifest-path "$RUNNER_TEMP/sdk/Cargo.toml" -p msdk-gtk --test lifecycle --test runtime --test cli --test usage -- --test-threads=1
      - name: Capture candidate usage rows for review
        run: |
          cargo build --manifest-path "$RUNNER_TEMP/sdk/Cargo.toml" -p msdk-gtk --example usage_preview
          icons="$RUNNER_TEMP/usage-data/icons/hicolor/scalable/apps"
          mkdir -p "$icons"
          for provider in openai claude grok opencode; do
            install -m 644 "mseries/codexbar-wingpanel/icons/$provider.svg" "$icons/mseries-codexbar-$provider-symbolic.svg"
          done
          for mode in light dark; do
            theme=Adwaita
            if [ "$mode" = dark ]; then theme=Adwaita:dark; fi
            for points in 10 15; do
              config="$RUNNER_TEMP/usage-config-$mode-$points"
              mkdir -p "$config/gtk-4.0"
              printf '[Settings]\ngtk-font-name=Sans %s\n' "$points" > "$config/gtk-4.0/settings.ini"
              XDG_DATA_HOME="$RUNNER_TEMP/usage-data" XDG_CONFIG_HOME="$config" GTK_THEME="$theme" GSK_RENDERER=cairo MSDK_MATRIX_POINTS="$points" \
                xvfb-run -a dbus-run-session -- bash -eu -c '
                  python3 mseries/sdk-tests/font-profile.py
                  "$CARGO_TARGET_DIR/debug/examples/usage_preview" "$RUNNER_TEMP/sdk-evidence/usage-'"$mode"'-'"$points"'.png"
                '
              XDG_DATA_HOME="$RUNNER_TEMP/usage-data" XDG_CONFIG_HOME="$config" GTK_THEME="$theme" GSK_RENDERER=cairo MSDK_USAGE_SCROLL_END=1 \
                xvfb-run -a dbus-run-session -- \
                  "$CARGO_TARGET_DIR/debug/examples/usage_preview" "$RUNNER_TEMP/sdk-evidence/usage-$mode-$points-end.png"
            done
          done
      - name: Package, install, reinstall and remove the generated app
        run: |
          "$CARGO_TARGET_DIR/debug/msdk" pack "$RUNNER_TEMP/generated" \
            --binary "$CARGO_TARGET_DIR/debug/msdk-sdksettings" \
            --output "$RUNNER_TEMP/sdk-evidence/settings.deb"
          dpkg-deb --info "$RUNNER_TEMP/sdk-evidence/settings.deb" > "$RUNNER_TEMP/sdk-evidence/package-info.txt"
          sudo dpkg --install "$RUNNER_TEMP/sdk-evidence/settings.deb"
          sudo dpkg --install "$RUNNER_TEMP/sdk-evidence/settings.deb"
          cmp "$CARGO_TARGET_DIR/debug/msdk-sdksettings" /usr/bin/io.github.techmore.SdkSettings
          GTK_THEME=Adwaita GSK_RENDERER=cairo xvfb-run -a dbus-run-session -- \
            /usr/bin/io.github.techmore.SdkSettings --screenshot "$RUNNER_TEMP/sdk-evidence/installed.png"
          sha256sum /usr/bin/io.github.techmore.SdkSettings > "$RUNNER_TEMP/sdk-evidence/installed.sha256"
          sudo dpkg --remove msdk-io.github.techmore.sdksettings
          test ! -e /usr/bin/io.github.techmore.SdkSettings
          test ! -e /usr/share/applications/io.github.techmore.SdkSettings.desktop
          test ! -e /usr/share/icons/hicolor/scalable/apps/io.github.techmore.SdkSettings.svg
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: msdk-native-${{ github.run_id }}
          path: ${{ runner.temp }}/sdk-evidence/
          if-no-files-found: warn
