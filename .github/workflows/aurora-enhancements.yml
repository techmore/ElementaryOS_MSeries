name: Aurora enhancement candidate

on:
  pull_request:
    paths:
      - "mseries/ci/**"
      - "mseries/aurora/candidate.py"
      - "mseries/aurora/release.py"
      - "mseries/aurora/release.json"
      - "mseries/aurora/enhancements/**"
      - "mseries/aurora/unified72/series.json"
      - "mseries/aurora/unified72/egpu-series.json"
      - "mseries/aurora/unified72/connectx-series.json"
      - "mseries/aurora/unified72/combined-series.json"
      - "mseries/aurora/unified72/patches/**"
      - ".github/workflows/aurora-enhancements.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: Kernel profile (eGPU remains an unqualified experiment)
        type: choice
        options: [candidate, egpu, unified72, unified72-egpu, unified72-connectx, unified72-combined]
        default: candidate

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ARM64 ${{ matrix.profile }} build and payload inspection
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.profile)) || fromJSON('["candidate","unified72"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Install native build tools
        timeout-minutes: 20
        run: |
          sudo --preserve-env=GITHUB_ACTIONS python3 mseries/ci/install_aurora_tools.py
          timeout --kill-after=15s 300 rustup toolchain install 1.93.1 --profile minimal --component rust-src --component rustfmt
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      - name: Prepare pinned sources and patches
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          python3 -m unittest discover -s mseries/aurora -p 'test_*.py' -v
          python3 mseries/aurora/candidate.py prepare --cache "$RUNNER_TEMP/aurora-cache" \
            --output "$RUNNER_TEMP/aurora-prepared" --profile "$PROFILE"
      - name: Exercise selected production kernel logic
        env:
          RUSTUP_TOOLCHAIN: 1.93.1
        run: python3 mseries/aurora/candidate.py check --prepared "$RUNNER_TEMP/aurora-prepared"
      - name: Build kernel, modules, DTBs and payload-only Debian package
        env:
          LIBCLANG_PATH: /usr/lib/llvm-22/lib
        run: |
          python3 mseries/aurora/candidate.py build --prepared "$RUNNER_TEMP/aurora-prepared" \
            --output "$RUNNER_TEMP/aurora-enhancements" --jobs 4
      - name: Inspect package boundaries
        run: |
          cd "$RUNNER_TEMP/aurora-enhancements"
          sha256sum --check SHA256SUMS
          deb=(linux-image-elementary-aurora*.deb)
          test "${#deb[@]}" -eq 1
          dpkg-deb --info "${deb[0]}"
          dpkg-deb --control "${deb[0]}" "$RUNNER_TEMP/candidate-control"
          test "$(find "$RUNNER_TEMP/candidate-control" -type f | wc -l)" -eq 1
          dpkg-deb --extract "${deb[0]}" "$RUNNER_TEMP/candidate-inspect"
          test ! -e "$RUNNER_TEMP/candidate-inspect/boot"
          test ! -e "$RUNNER_TEMP/candidate-inspect/etc"
          test ! -e "$RUNNER_TEMP/candidate-inspect/usr/lib/modprobe.d/linux-aurora-phram.conf"
          pkg=$(dpkg-deb --field "${deb[0]}" Package)
          test -f "$RUNNER_TEMP/candidate-inspect/usr/lib/modprobe.d/$pkg-phram.conf"
      - name: Preserve resolved configuration on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: aurora-enhancement-diagnostics-${{ matrix.profile }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/aurora-prepared/candidate.json
            ${{ runner.temp }}/aurora-prepared/build/.config
          retention-days: 7
          include-hidden-files: true
      - name: Preserve package, complete corresponding source and provenance
        uses: actions/upload-artifact@v7
        with:
          name: elementary-aurora-enhancements-${{ matrix.profile }}-${{ github.run_id }}
          path: ${{ runner.temp }}/aurora-enhancements/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
