name: Build and Release Stable (elementary OS 9)

# Upstream's monthly schedule is removed on this fork: the release pipeline needs
# upstream's signing key and R2 bucket credentials, which a fork does not have, so
# it could only fail every month. Fork builds are manual (daily-9.0.yml).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  call-reusable-build:
    # build-release.yml asks for contents: write; a reusable call cannot exceed its caller.
    permissions:
      contents: write
    if: github.repository == 'elementary/os'
    uses: ./.github/workflows/build-release.yml
    with:
      stream: stable
    secrets: inherit
