# M-series: fast validation of the Apple Silicon build wiring. Parses every
# mkosi config (catches bad references/typos in mkosi.images/**) and syntax-
# checks the layer's scripts. Does NOT build images — full arm64 builds run
# via workflow_dispatch on Daily OS 9.
name: Validate M-series wiring

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Justfile"
      - "assemble-iso.sh"
      - "mkosi.conf"
      - "mkosi.images/**"
      - "mkosi.conf.d/**"
      - "mkosi.bump"
      - "repos/**"
      - "packages.arm64"
      - "transform/**"
      - "bin/**"
      - "mseries/**"
      - "docs/build-status.*"
      - "docs/local-build-status.html"
      - ".github/workflows/**"

jobs:
  speech-release:
    name: English F5 release contracts (arm64)
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install private GTK test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-ibus-1.0 gir1.2-atspi-2.0 dbus-x11 xvfb xauth
      - name: Verify source-only release, rollback and host checks
        run: |
          bash -n mseries/releases/v0.0.1/install.sh
          python3 -B -m unittest discover -s mseries/releases -p 'test_*.py'
          python3 -B mseries/releases/v0.0.1/test_preflight.py
      - name: Verify transcript-only UI without microphone or models
        run: |
          python3 -B mseries/dictation/speech-only-panel-smoke.py
          python3 -B mseries/dictation/speech-only-panel-smoke.py --default-review

  bluetooth:
    name: Quick Settings Bluetooth controls (arm64)
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install native GTK and private D-Bus test dependencies
        run: sudo apt-get update && sudo apt-get install -y valac libgtk-4-dev libgranite-7-dev python3-dbus python3-gi dbus-x11 xvfb xauth
      - name: Exercise BlueZ controls without touching hardware
        run: bash mseries/quick-settings/tests/test-bluetooth.sh

  orchard:
    name: Orchard GTK output and lifecycle regressions (arm64)
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK and Granite test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-granite-7.0 xvfb xauth
      - name: Test without a daemon or real guests
        run: |
          python3 -m py_compile mseries/orchard-incus/orchard_incus/*.py mseries/orchard-incus/tools/*.py
          xvfb-run -a env -u DBUS_SESSION_BUS_ADDRESS GSK_RENDERER=cairo GDK_BACKEND=x11 \
            PYTHONWARNINGS=ignore::DeprecationWarning G_DEBUG=fatal-criticals \
            python3 -m unittest discover -s mseries/orchard-incus/tests

  dock-startup:
    name: Dock startup and launcher regressions (arm64)
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y git valac libglib2.0-dev
      - name: Verify activation, delayed Gala readiness and session stops
        run: |
          bash mseries/dock-tests/test-startup.sh
          python3 mseries/dock-tests/test-launcher.py

  desktop-space:
    name: Native notch GTK allocation (arm64)
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK test dependencies
        run: sudo apt-get update && sudo apt-get install -y git valac libgtk-4-dev xvfb xauth build-essential
      - name: Test production notch geometry and crowded panel allocation
        run: bash mseries/display-space/test-notch-layout.sh
      - name: Verify exact-kernel boot profile and rollback
        run: python3 -m unittest discover -s mseries/display-space -p 'test_*.py'

  machine-lab:
    name: Machine Lab build and logic tests (arm64)
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build valac gcc pkg-config libgtk-4-dev libgranite-7-dev python3 appstream desktop-file-utils xvfb xauth
      - name: Build and run the logic tests (persistence, discovery, QMP transport)
        run: |
          meson setup build-ml mseries/machine-lab
          meson compile -C build-ml
          xvfb-run -a meson test -C build-ml --print-errorlogs
      - name: Check the version flag and desktop metadata
        run: |
          xvfb-run -a build-ml/machine-lab --version
          desktop-file-validate mseries/machine-lab/data/io.github.mseries.MachineLab.desktop
          appstreamcli validate --no-net mseries/machine-lab/data/io.github.mseries.MachineLab.metainfo.xml
      - name: Build the Debian package
        run: |
          sudo apt-get install -y dpkg-dev
          MACHINE_LAB_OUTPUT_DIR="$RUNNER_TEMP/ml-deb" bash mseries/machine-lab/build-deb.sh

  codexbar-wingpanel:
    name: CodexBar Wingpanel module, render and interaction probes (arm64)
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install native build and headless test dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y git meson ninja-build valac gcc pkg-config
          libgtk-4-dev libjson-glib-dev libgee-0.8-dev libgranite-7-dev sassc gettext
          python3 xvfb xauth dbus-x11 librsvg2-common
      - name: Provide Granite 7.7 and the pinned Wingpanel indicator API when the distro lacks them
        run: bash mseries/codexbar-wingpanel/probe/ci-build-deps.sh "$RUNNER_TEMP/prefix" >> "$GITHUB_ENV"
      - name: Build the module; run unit tests, generated-C guard, Switch/ingestion/token/Grok probes
        run: |
          meson setup "$RUNNER_TEMP/codexbar" mseries/codexbar-wingpanel
          ninja -C "$RUNNER_TEMP/codexbar"
          meson test -C "$RUNNER_TEMP/codexbar" --print-errorlogs

  calendar-agenda:
    name: Calendar Events/Tasks/Homeboard agenda on a private EDS (arm64)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install build and headless EDS test dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y git meson ninja-build valac gcc pkg-config gettext sassc
          libgtk-4-dev libgranite-7-dev libadwaita-1-dev libgee-0.8-dev libjson-glib-dev libecal2.0-dev libedataserver1.2-dev
          libical-dev evolution-data-server gsettings-desktop-schemas libglib2.0-bin python3 xvfb xauth dbus
          dbus-x11 librsvg2-common
      - name: Build the pinned indicator with our patch and run every agenda group
        run: bash mseries/calendar/ci-test-agenda.sh "$RUNNER_TEMP/agenda"

  validate:
    name: mkosi summary + script checks (arm64)
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install just podman zstd bison flex device-tree-compiler mtools fdisk shellcheck -y

      - name: Signal accent palette completeness
        run: python3 mseries/test-signal-accent.py
      - name: Shell syntax check (M-series scripts)
        run: |
          set -e
          bash -n mkosi.images/apple-silicon/mkosi.postinst.chroot
          bash -n mkosi.images/apple-silicon/mkosi.finalize
          bash -n mkosi.images/apple-silicon/build-network-indicator
          bash -n mkosi.images/apple-silicon/build-local-ai
          for f in mseries/local-ai/*.sh; do bash -n "$f"; done
          python3 -m py_compile mseries/local-ai/*.py
          bash -n mkosi.images/apple-silicon/mkosi.extra/usr/sbin/mseries-wifi-resume-fix
          bash -n mkosi.images/apple-silicon/mkosi.extra/usr/sbin/mseries-wifi-firmware
          bash -n transform/elementary-grow.sh
          bash -n bin/elementary-mac-setup
          for f in mseries/install-*.sh mseries/lib-backup.sh mseries/boot/mkinitcpio-snippet mseries/disable-notch-for-pantheon.sh; do bash -n "$f"; done
          shellcheck -S warning bin/elementary-mac-setup transform/elementary-grow.sh mseries/install-unlock-screen.sh mseries/install-boot-isolation.sh mseries/lib-backup.sh mseries/boot/mkinitcpio-snippet mseries/enhance.sh mseries/enhance-firstboot.sh mseries/install-brave.sh mseries/install-video-decode.sh mseries/test-installer-flow.sh mseries/vms/mseries-vm mseries/vms/test-mseries-vm.sh mseries/install-machine-lab.sh mseries/machine-lab/build-deb.sh mseries/machine-lab/launcher/run-vm.sh mseries/install-quieter-sound-theme.sh mseries/test-quieter-sound-theme.sh mseries/aurora-sep/install-aurora-sep.sh mseries/aurora-sep/install-touchid-gui.sh
          bash -n mseries/vms/mseries-vm
          bash mseries/vms/test-mseries-vm.sh
          bash mseries/test-quieter-sound-theme.sh
          bash mseries/test-elementary-mac-setup.sh
          bash mseries/test-installer-flow.sh
          bash -n assemble-iso.sh
          bash -n mseries/local-build-worker.sh
          bash -n mseries/fairydust/debian/build.sh
          bash -n mseries/fairydust/debian/fetch-asahi-boot-packages.sh
          bash -n mseries/aurora-sep/install-aurora-sep.sh
          bash -n mseries/aurora-sep/install-touchid-gui.sh
          python3 -m py_compile mseries/fairydust/debian/assemble-m1n1-bootbin.py
          python3 mseries/fairydust/debian/test-assemble-m1n1-bootbin.py
          python3 -m py_compile mseries/fairydust/debian/verify-m1n1-esp.py
          python3 mseries/fairydust/debian/test-verify-m1n1-esp.py
          python3 -m py_compile mseries/fairydust/debian/monitor.py mseries/check-kernel-config.py
          bash -n mseries/iso-label.sh
          bash -n mseries/test-iso-label.sh
          bash mseries/test-iso-label.sh
          bash mseries/test-greeter-obex-fix.sh
          bash -n mseries/install-signal.sh
          bash -n mseries/install-codexbar.sh
          bash -n mseries/deploy-codexbar.sh
          bash -n mseries/lib-codexbar.sh
          bash -n mseries/install-codexbar-wingpanel.sh
          python3 mseries/test-codexbar-deploy.py
          bash -n mseries/check-codexbar-port.sh
          python3 mseries/test-codexbar-cache.py
          python3 mseries/test-codexbar-sessions.py
          python3 mseries/test-codexbar-performance.py
          python3 mseries/test-codexbar-accounts.py
          python3 mseries/test-codexbar-claude.py
          python3 mseries/test-codexbar-claude-history.py
          python3 mseries/test-codexbar-claude-handoff.py
          python3 mseries/test-codexbar-wrapper.py
          python3 mseries/test-codexbar-opencode-local.py
          python3 mseries/test-codexbar-opencode-login.py
          python3 -m unittest discover -s mseries/display-space -p 'test_*.py'
          python3 -m py_compile mseries/display-space/*.py
          bash -n mseries/display-space/test-notch-layout.sh
          python3 -m py_compile mseries/apply-desktop-settings.py
          python3 -m py_compile mkosi.images/apple-silicon/mkosi.extra/usr/libexec/mseries-brightness
          python3 mseries/test-wifi-resume.py
          bash -n mseries/power/mseries-power mseries/power/vrr-check.sh mseries/power/macos-baseline/make_test_videos.sh
          python3 -m py_compile mseries/power/macos-baseline/*.py
          python3 mseries/test-power-cap.py
          python3 -m unittest discover -s mseries/power/macos-baseline -p 'test_*.py'
          python3 mseries/test-power-install.py
          bash -n mseries/fairydust/usb4/test-dp-tunnel.sh
          python3 -m py_compile mseries/fairydust/usb4/*.py mseries/fairydust/usb4/tools/*.py
          for f in mseries/fairydust/usb4/test-*.py; do python3 "$f"; done
          python3 mseries/fairydust/usb4/tools/test-staging-tools.py
          python3 mseries/aurora-sep/test_touchid_core.py
          python3 -m unittest discover -s mseries/aurora -p 'test_*.py'
          python3 mseries/local-ai/test_people_watch.py
          python3 mseries/test-image-wiring.py
          python3 mseries/video-decode/test-brave-factory.py
          python3 mseries/video-decode/test-youtube-launch.py
          shellcheck -S warning mseries/video-decode/brave-youtube mseries/install-brave-widevine.sh
          shellcheck -S warning mseries/calendar/ci-test-agenda.sh mseries/install-homeboard-sync.sh
          shellcheck -S warning mseries/lib-codexbar.sh mseries/deploy-codexbar.sh mseries/install-codexbar.sh mseries/install-codexbar-wingpanel.sh mseries/check-codexbar-port.sh mseries/codexbar-wingpanel/probe/ci-build-deps.sh mseries/codexbar-wingpanel/probe/run-grok-probe.sh
          python3 mseries/boot/test-prepare-uki-kernels.py
          python3 mseries/test-kernel-config.py
          python3 mseries/test-local-build-preflight.py
          node mseries/test-build-status.mjs
          node mseries/test-local-build-status.mjs
          python3 -m unittest discover -s mseries/brightness -p 'test_*.py'
          python3 -m unittest discover -s mseries/keyboard-backlight -p 'test_*.py'
          python3 -m unittest discover -s mseries/audio -p 'test_*.py'
          python3 -m unittest discover -s mseries/airplay -p 'test_*.py'
          python3 -m unittest discover -s mseries/local-ai -p 'test_*.py'
          python3 -m unittest discover -s mseries/dictation -p 'test_*.py'

      - name: Validate experimental dock patches offline
        run: |
          set -euo pipefail
          curl -fL --retry 2 https://codeload.github.com/AsahiLinux/linux/tar.gz/ce9f2eba72c061a50b2d790450e90af3439d8c24 -o "$RUNNER_TEMP/fairydust.tar.gz"
          python3 mseries/fairydust/usb4/tools/validate-dock-patches.py --archive "$RUNNER_TEMP/fairydust.tar.gz" --output "$RUNNER_TEMP/dock-patch-validation"

      - name: mkosi config parse check (all images)
        run: |
          set -euo pipefail
          just mkosi summary | tee /tmp/mseries-mkosi-summary.txt
          python3 mseries/test-image-wiring.py --summary /tmp/mseries-mkosi-summary.txt

  hardware-support:
    name: Hardware diagnostics and recovery fixtures
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install offline test tools
        run: sudo apt-get update && sudo apt-get install -y mtools fdisk shellcheck python3-libarchive-c keyutils
      - name: Validate hardware ports without target hardware
        run: |
          set -euo pipefail
          python3 -m unittest discover -s mseries/aurora-sep -p 'test_touchid*.py'
          python3 -m unittest discover -s mseries/power -p 'test_diagnostics.py'
          MSERIES_REQUIRE_ESP_TOOLS=1 python3 -m unittest discover -s mseries/hardware -p 'test_*.py'
          bash mseries/hardware/test-bluetooth.sh
          shellcheck -S warning mseries/install-hardware-support.sh mseries/hardware/bluetooth-resume-fix mseries/hardware/bluetooth-supported mseries/power/mseries-sleep-cost-hook
          bash -n mseries/enhance.sh mseries/stage-factory-enhancements.sh mseries/aurora-sep/install-touchid-gui.sh
          python3 mseries/test-image-wiring.py
          python3 mseries/video-decode/test-brave-factory.py
          python3 mseries/video-decode/test-youtube-launch.py
          python3 mseries/boot/test-prepare-uki-kernels.py
          python3 mseries/test-power-install.py
          python3 mseries/test-omdrop-installer.py
          python3 -m unittest discover -s mseries/omdrop-awdl/tests
          python3 -m unittest discover -s mseries/omdrop/tests
