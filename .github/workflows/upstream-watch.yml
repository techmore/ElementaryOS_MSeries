name: Watch public upstreams
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: upstream-watch-dashboard
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Update upstream dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 mseries/local-ai/github-watch.py
      - name: Preserve all discovered public branch heads
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-developer-branch-heads
          path: mseries-upstream-branch-heads.json
          retention-days: 90
