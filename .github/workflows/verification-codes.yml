name: Native verification code offers
on:
  workflow_dispatch:
  pull_request:
    paths:
      - mseries/phone-setup/*code*.py
      - mseries/install-verification-codes.sh
      - .github/workflows/verification-codes.yml
# New commits replace only checks for this workflow and PR. Publishing is not preempted.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codes:
    name: Private native field insertion and shortcut preservation (arm64)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: erikwb/blueferry
          ref: 60fd7ef1abbd25947981f0cf27a521d82784a75f
          path: .code-test-blueferry
      - name: Install native fixture dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-gi python3-dbus python3-pil gir1.2-gtk-4.0 gir1.2-atspi-2.0 libgranite-7-dev at-spi2-core dbus-x11 xvfb xauth xdotool gsettings-desktop-schemas gnome-settings-daemon-common shellcheck
      - name: Check models, actual field editing and settings in isolation
        env:
          PYTHONPATH: ${{ github.workspace }}/.code-test-blueferry/src
        run: |
          bash -n mseries/install-verification-codes.sh
          shellcheck mseries/install-verification-codes.sh
          python3 mseries/phone-setup/check_verification_codes.py
