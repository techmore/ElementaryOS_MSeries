name: Daily OS 9

on:
  # M-series: push trigger removed — upstream release jobs need signing/R2
  # secrets this fork does not have. Build on demand via workflow_dispatch.
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  call-reusable-build:
    uses: ./.github/workflows/build-release.yml
    with:
      stream: daily
    secrets: inherit
