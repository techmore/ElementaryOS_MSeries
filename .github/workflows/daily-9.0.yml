name: OS 9 M-series experimental build

# Manual fork builds use CI artifacts, without upstream signing/R2 secrets.
on:
  workflow_dispatch:
    inputs:
      fairydust:
        description: Build the experimental Fairydust + USB4 kernel and image
        type: boolean
        required: false
        default: false
      fairydust_tunnel:
        description: Also apply the experimental USB4 DP-tunnel patch (see mseries/fairydust/usb4/DP-TUNNEL-RE.md)
        type: boolean
        required: false
        default: false
      m4_kernel_only:
        description: Build and inspect the pinned M4 research kernel only (no image or promotion)
        type: boolean
        required: false
        default: false
      m4_userspace_only:
        description: Build and inspect pinned Gravity Mesa only (no image or promotion)
        type: boolean
        required: false
        default: false
      m4_boot_only:
        description: Build and inspect pinned M4 boot-chain research artifacts only
        type: boolean
        required: false
        default: false
      m4_image_only:
        description: Assemble the full M4 research image graph from reviewed hosted inputs
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: os9-mseries-${{ github.ref }}${{ inputs.m4_userspace_only && '-m4-userspace' || inputs.m4_boot_only && '-m4-boot' || inputs.m4_image_only && '-m4-image' || '' }}
  cancel-in-progress: false

jobs:
  build-kernel:
    if: inputs.fairydust && !inputs.m4_kernel_only && !inputs.m4_userspace_only && !inputs.m4_boot_only && !inputs.m4_image_only
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Install kernel build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio curl dwarves flex \
            libdw-dev libelf-dev libncurses-dev libssl-dev libclang-dev clang \
            pahole python3 rsync rustc rust-src bindgen fakeroot debhelper
      - name: Install Rust standard-library sources
        run: |
          rustup show active-toolchain
          rustup component add rust-src --toolchain stable
          rustc --version
      - name: Build pinned Fairydust kernel Debian package
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.fairydust_tunnel }}" == "true" ]]; then
            export FAIRYDUST_DP_TUNNEL=1
            kv='7.1.13-elementary-fairydust-usb4-dptunnel'
            pkgv='7.1.13+elementary.usb4-dp1'
          else
            kv='7.1.13-elementary-fairydust-usb4'
            pkgv='7.1.13+elementary.usb4.4'
          fi
          echo "kernel release: $kv (DP tunnel build: ${FAIRYDUST_DP_TUNNEL:-0})"
          archive="$RUNNER_TEMP/linux-ce9f2eba72c061a50b2d790450e90af3439d8c24.tar.gz"
          curl --fail --location --retry 4 --proto '=https' --tlsv1.2 \
            https://codeload.github.com/AsahiLinux/linux/tar.gz/ce9f2eba72c061a50b2d790450e90af3439d8c24 \
            --output "$archive"
          echo '20ce358acffff4b3de86201975cd68c7aaf241ae010ec3cca9422bbe2b7f34aa  '"$archive" | sha256sum --check
          FAIRYDUST_WORKDIR="$RUNNER_TEMP/fairydust" \
          FAIRYDUST_SOURCE_ARCHIVE="$archive" \
            bash mseries/fairydust/debian/build.sh --build
          mkdir -p mkosi.packages
          kernel_deb="$RUNNER_TEMP/fairydust/linux-image-${kv}_${pkgv}_arm64.deb"
          cp "$kernel_deb" mkosi.packages/
          mseries/fairydust/debian/fetch-asahi-boot-packages.sh mkosi.packages
          boot_inputs="$RUNNER_TEMP/fairydust-boot-inputs"
          mkdir -p "$boot_inputs/kernel" "$boot_inputs/m1n1" "$boot_inputs/u-boot"
          dpkg-deb -x "$kernel_deb" "$boot_inputs/kernel"
          dpkg-deb -x mkosi.packages/m1n1_1.5.2-2ubuntu0.1~asahi1_arm64.deb "$boot_inputs/m1n1"
          dpkg-deb -x mkosi.packages/u-boot-asahi_2025.10-2-1_arm64.deb "$boot_inputs/u-boot"
          python3 mseries/fairydust/debian/assemble-m1n1-bootbin.py \
            --m1n1 "$boot_inputs/m1n1/usr/lib/m1n1/m1n1.bin" \
            --dtb-dir "$boot_inputs/kernel/usr/lib/linux-image-${kv}/apple" \
            --u-boot "$boot_inputs/u-boot/usr/lib/u-boot/apple_m1/u-boot-nodtb.bin" \
            --output mkosi.packages/fairydust-m1n1-boot.bin
          (cd mkosi.packages && sha256sum fairydust-m1n1-boot.bin > FAIRYDUST-BOOT-SHA256SUMS)
          (cd mkosi.packages && sha256sum *.deb > SHA256SUMS)
      - name: Preserve pinned experimental kernel packages
        uses: actions/upload-artifact@v7
        with:
          name: fairydust-kernel-packages-${{ github.run_id }}
          path: mkosi.packages/
          retention-days: 2

  build-m4-kernel:
    if: inputs.m4_kernel_only
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 180
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@v7
      - name: Validate research-only selection
        run: |
          set -euo pipefail
          [[ "${{ inputs.fairydust }}" != true && "${{ inputs.fairydust_tunnel }}" != true && "${{ inputs.m4_userspace_only }}" != true ]]
          [[ "${{ inputs.m4_boot_only }}" != true && "${{ inputs.m4_image_only }}" != true ]]
          [[ "$(uname -m)" == aarch64 ]]
          mkdir -p build-record
          git rev-parse HEAD > build-record/source-commit.txt
          printf '%s\n' 'M4 kernel candidate only. No image, factory promotion, installation or hardware qualification.' > build-record/STATUS.txt
      - name: Free disposable runner build space
        uses: jlumbroso/free-disk-space@v2
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Install native M4 build and inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio curl dwarves flex \
            libdw-dev libelf-dev libncurses-dev libssl-dev clang-21 libclang-21-dev \
            llvm-21 pahole python3 rsync bindgen kmod device-tree-compiler zstd
      - name: Select matched Rust compiler and library sources
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal --component rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo '/usr/lib/llvm-21/bin' >> "$GITHUB_PATH"
          echo 'LIBCLANG_PATH=/usr/lib/llvm-21/lib' >> "$GITHUB_ENV"
      - name: Build and package pinned Gravity M4 kernel
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/linux-4fc326f.tar.gz"
          curl --fail --location --retry 4 --proto '=https' --tlsv1.2 \
            https://codeload.github.com/GravityLinux/linux/tar.gz/4fc326f6c25ccceb7515e2635c22e01fde5d3bac \
            --output "$archive"
          echo '045c64540fa4210394c899cad6320c5bf9090a66919938d986aeaad0033946e8  '"$archive" | sha256sum --check
          SOURCE_DATE_EPOCH=$(python3 -c 'import sys,tarfile; print(int(tarfile.open(sys.argv[1]).next().mtime))' "$archive")
          KBUILD_BUILD_TIMESTAMP=$(date -u -d "@$SOURCE_DATE_EPOCH" '+%a %b %d %T UTC %Y')
          export SOURCE_DATE_EPOCH KBUILD_BUILD_TIMESTAMP
          export KBUILD_BUILD_USER=elementary-mseries KBUILD_BUILD_HOST=m4-research-ci
          rust_library="$(rustc --print sysroot)/lib/rustlib/src/rust/library"
          { rustc --version --verbose; clang --version; ld --version; bindgen --version; pahole --version; df -h; } > build-record/toolchain.txt
          python3 mseries/m4-mini/build-kernel.py --archive "$archive" \
            --rust-library "$rust_library" --output "$RUNNER_TEMP/m4-kernel" --jobs 2
          python3 mseries/m4-mini/package-kernel.py --archive "$archive" \
            --source "$RUNNER_TEMP/m4-kernel/linux-4fc326f6c25ccceb7515e2635c22e01fde5d3bac" \
            --build "$RUNNER_TEMP/m4-kernel/build" --output mkosi.packages-m4-research
          python3 mseries/m4-mini/check-kernel-package.py \
            --package mkosi.packages-m4-research/linux-image-elementary-m4-gravity1_7.1.13+elementary.m4.gravity1-5_arm64.deb \
            --package-receipt mkosi.packages-m4-research/receipt.json \
            --build-receipt "$RUNNER_TEMP/m4-kernel/receipt.json" --receipt build-record/package-check.json
          mkdir -p mkosi.packages-m4-research/reproduction
          cp mseries/m4-mini/{build-kernel,package-kernel,check-kernel-package}.py mkosi.packages-m4-research/reproduction/
          cp -a mseries/m4-mini/gravity mkosi.packages-m4-research/reproduction/
          cp mseries/m4-mini/research.json mkosi.packages-m4-research/reproduction/
          cp "$RUNNER_TEMP/m4-kernel/receipt.json" mkosi.packages-m4-research/build-receipt.json
          cp build-record/{source-commit.txt,STATUS.txt,toolchain.txt,package-check.json} mkosi.packages-m4-research/
          (cd mkosi.packages-m4-research && sha256sum *.deb *.tar.gz > SHA256SUMS)
      - name: Collect research build diagnostics
        if: always()
        run: |
          mkdir -p build-record
          for candidate in "$RUNNER_TEMP/m4-kernel/build.log" "$RUNNER_TEMP/m4-kernel/receipt.json" "$RUNNER_TEMP/m4-kernel/build/.config"; do
            if [[ -f "$candidate" ]]; then cp "$candidate" build-record/; fi
          done
      - name: Preserve M4 research build records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m4-kernel-record-${{ github.run_id }}
          path: build-record/
          retention-days: 7
      - name: Preserve unpromoted M4 kernel candidate and corresponding source
        uses: actions/upload-artifact@v7
        with:
          name: m4-kernel-candidate-${{ github.run_id }}
          path: mkosi.packages-m4-research/
          compression-level: 0
          if-no-files-found: error
          retention-days: 2

  build-m4-userspace:
    if: inputs.m4_userspace_only
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 180
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - name: Validate Mesa-only research selection
        run: |
          set -euo pipefail
          [[ "${{ inputs.fairydust }}" != true && "${{ inputs.fairydust_tunnel }}" != true && "${{ inputs.m4_kernel_only }}" != true ]]
          [[ "${{ inputs.m4_boot_only }}" != true && "${{ inputs.m4_image_only }}" != true ]]
          [[ "$(uname -m)" == aarch64 ]]
          mkdir -p build-record
          git rev-parse HEAD > build-record/source-commit.txt
          printf '%s\n' 'M4 Mesa candidate only. No image, factory promotion, installation, GPU or Vulkan qualification.' > build-record/STATUS.txt
      - name: Free disposable runner build space
        uses: jlumbroso/free-disk-space@v2
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Install Mesa build and software-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl meson ninja-build pkg-config dpkg-dev \
            clang-21 libclang-21-dev llvm-21-dev libclc-21 libclc-21-dev libllvmspirvlib-21-dev \
            spirv-tools spirv-tools-dev glslang-tools bindgen cbindgen bison flex \
            python3-mako python3-ply python3-yaml python3-packaging python3-pycparser \
            libdrm-dev libdisplay-info-dev libgbm-dev libexpat1-dev libudev-dev libelf-dev libunwind-dev libzstd-dev zlib1g-dev \
            libwayland-dev libwayland-egl-backend-dev wayland-protocols libx11-dev libx11-xcb-dev libxext-dev \
            libxfixes-dev libxdamage-dev libxrandr-dev libxshmfence-dev libxxf86vm-dev libxcb1-dev libxcb-dri2-0-dev \
            libxcb-dri3-dev libxcb-glx0-dev libxcb-present-dev libxcb-randr0-dev \
            libxcb-shm0-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-render0-dev libxcb-shape0-dev libegl-dev libgl-dev libglvnd-dev libvulkan-dev
      - name: Select research Rust and LLVM tools
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal --component rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo '/usr/lib/llvm-21/bin' >> "$GITHUB_PATH"
          echo 'LIBCLANG_PATH=/usr/lib/llvm-21/lib' >> "$GITHUB_ENV"
      - name: Build, test, package and inspect matched Gravity Mesa
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mesa-87ac51d.tar.gz"
          curl --fail --location --retry 4 --proto '=https' --tlsv1.2 \
            https://codeload.github.com/GravityLinux/mesa/tar.gz/87ac51d411f0e58a9433567ec2666f457be89e1d \
            --output "$archive"
          echo '1195f212bcf5816b8b893113b0b5dc578ce744d420856b6ad4f42008889e231e  '"$archive" | sha256sum --check
          SOURCE_DATE_EPOCH=$(python3 -c 'import sys,tarfile; print(int(tarfile.open(sys.argv[1]).next().mtime))' "$archive")
          export SOURCE_DATE_EPOCH
          { rustc --version --verbose; cc --version; clang --version; llvm-config --version; bindgen --version; cbindgen --version; meson --version; pkg-config --modversion libdrm egl gl; df -h; } > build-record/toolchain.txt
          python3 mseries/m4-mini/build-mesa.py --archive "$archive" --output "$RUNNER_TEMP/m4-mesa" --jobs 2
          python3 mseries/m4-mini/package-mesa.py --archive "$archive" \
            --source "$RUNNER_TEMP/m4-mesa/mesa-87ac51d411f0e58a9433567ec2666f457be89e1d" \
            --stage "$RUNNER_TEMP/m4-mesa/stage" --validation "$RUNNER_TEMP/m4-mesa/receipt.json" \
            --output mkosi.packages-m4-mesa-research
          python3 mseries/m4-mini/check-mesa-package.py \
            --package mkosi.packages-m4-mesa-research/elementary-m4-gravity-mesa1_26.3.0~devel+gravity.87ac51d-4_arm64.deb \
            --package-receipt mkosi.packages-m4-mesa-research/receipt.json \
            --build-receipt "$RUNNER_TEMP/m4-mesa/receipt.json" --smoke "$RUNNER_TEMP/m4-mesa/mesa-software" \
            --receipt build-record/package-check.json
          mkdir -p mkosi.packages-m4-mesa-research/reproduction
          cp mseries/m4-mini/{build-mesa,package-mesa,check-mesa-package,run-mesa}.py mkosi.packages-m4-mesa-research/reproduction/
          cp mseries/m4-mini/test-mesa-software.c mkosi.packages-m4-mesa-research/reproduction/
          cp "$RUNNER_TEMP/m4-mesa/receipt.json" mkosi.packages-m4-mesa-research/build-receipt.json
          cp "$RUNNER_TEMP/m4-mesa/mesa-software" mkosi.packages-m4-mesa-research/
          cp build-record/{source-commit.txt,STATUS.txt,toolchain.txt,package-check.json} mkosi.packages-m4-mesa-research/
          (cd mkosi.packages-m4-mesa-research && sha256sum *.deb *.tar.gz > SHA256SUMS)
      - name: Collect Mesa research diagnostics
        if: always()
        run: |
          mkdir -p build-record
          for candidate in "$RUNNER_TEMP/m4-mesa/"*.log "$RUNNER_TEMP/m4-mesa/receipt.json"; do
            if [[ -f "$candidate" ]]; then cp "$candidate" build-record/; fi
          done
          if [[ -d "$RUNNER_TEMP/m4-mesa/build/meson-logs" ]]; then
            cp -a "$RUNNER_TEMP/m4-mesa/build/meson-logs" build-record/
          fi
      - name: Preserve Mesa research records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m4-mesa-record-${{ github.run_id }}
          path: build-record/
          retention-days: 7
      - name: Preserve unpromoted Mesa candidate and corresponding source
        uses: actions/upload-artifact@v7
        with:
          name: m4-mesa-candidate-${{ github.run_id }}
          path: mkosi.packages-m4-mesa-research/
          compression-level: 0
          if-no-files-found: error
          retention-days: 2

  build:
    needs: build-kernel
    if: always() && !inputs.m4_kernel_only && !inputs.m4_userspace_only && !inputs.m4_boot_only && !inputs.m4_image_only && (!inputs.fairydust || needs.build-kernel.result == 'success')
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Free build space
        uses: jlumbroso/free-disk-space@v2
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y just mtools podman zstd rsync
      - name: Download enhanced kernel packages
        if: inputs.fairydust
        uses: actions/download-artifact@v8
        with:
          name: fairydust-kernel-packages-${{ github.run_id }}
          path: mkosi.packages/
      - name: Verify experimental package provenance
        if: inputs.fairydust
        run: |
          (cd mkosi.packages && sha256sum --check SHA256SUMS && sha256sum --check UPSTREAM-SHA256SUMS && sha256sum --check FAIRYDUST-BOOT-SHA256SUMS)
          mkdir -p build-record
          install -D -m 0644 mkosi.packages/fairydust-m1n1-boot.bin \
            mkosi.images/sysupdate/mkosi.extra/efi/m1n1/boot.bin
          sha256sum mkosi.images/sysupdate/mkosi.extra/efi/m1n1/boot.bin \
            > build-record/fairydust-m1n1-boot.sha256
      - name: Record source provenance
        run: |
          mkdir -p build-record
          git rev-parse HEAD > build-record/source-commit.txt
          cp mseries/UPSTREAM-PINS.md build-record/
          printf '%s\n' 'Experimental OS 9 arm64 image. Kernel profile: ${{ inputs.fairydust }}. Not hardware-qualified. See mseries/POST-BOOT-CHECKS.md.' > build-record/STATUS.txt
      - name: Build experimental arm64 image
        shell: bash
        run: |
          set -euo pipefail
          just genkey 2>&1 | tee build-record/keygen.log
          if [[ "${{ inputs.fairydust }}" == "true" ]]; then
            just mkosi -B --debug --profile=daily,fairydust --force --workspace-directory=/workspace 2>&1 | tee build-record/build.log
            raw_images=()
            for candidate in mkosi.output/elementary_*.raw; do
              [[ -f "$candidate" && "$(basename "$candidate")" =~ ^elementary_[0-9]{14}\.raw$ ]] \
                && raw_images+=("$candidate")
            done
            [[ ${#raw_images[@]} == 1 ]] || { echo "Expected one sysupdate disk image, found ${#raw_images[@]}" >&2; exit 1; }
            python3 mseries/fairydust/debian/verify-m1n1-esp.py \
              --image "${raw_images[0]}" \
              --expected mkosi.images/sysupdate/mkosi.extra/efi/m1n1/boot.bin \
              | tee build-record/m1n1-esp-check.txt
            cat build-record/fairydust-m1n1-boot.sha256 >> build-record/m1n1-esp-check.txt
            sudo PROFILE=daily SQUASHFS_LEVEL="${SQUASHFS_LEVEL:-}" ./assemble-iso.sh 2>&1 | tee -a build-record/build.log
            sudo just compress-repo
            sudo chown -R "$(id -u):$(id -g)" mkosi.output
            sudo chmod -R u+rwX mkosi.output
          else
            just do-daily 2>&1 | tee build-record/build.log
          fi
          sudo python3 mseries/test-image-wiring.py --image-output mkosi.output | tee build-record/image-content.log
      - name: Checksum installer
        run: |
          cd mkosi.output
          sha256sum elementaryos-*.iso | tee INSTALLER-SHA256SUMS
          cp INSTALLER-SHA256SUMS ../build-record/
          stat --printf='%n %s bytes\n' elementaryos-*.iso > ../build-record/installer-sizes.txt
      - name: Preserve build records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: os9-mseries-build-record-${{ github.run_id }}
          path: build-record/
          retention-days: 14
      - name: Preserve experimental installer
        uses: actions/upload-artifact@v7
        with:
          name: os9-mseries-arm64-${{ github.run_id }}
          path: |
            mkosi.output/elementaryos-*.iso
            mkosi.output/INSTALLER-SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-m4-boot:
    if: inputs.m4_boot_only
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - name: Validate boot-only research selection
        run: |
          set -euo pipefail
          [[ "${{ inputs.fairydust }}" != true && "${{ inputs.fairydust_tunnel }}" != true && "${{ inputs.m4_kernel_only }}" != true && "${{ inputs.m4_userspace_only }}" != true && "${{ inputs.m4_image_only }}" != true ]]
      - name: Install native boot-chain build and fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex bc git curl swig \
            python3-dev python3-pyelftools pkg-config libssl-dev libgnutls28-dev \
            libncurses-dev uuid-dev device-tree-compiler mtools fdisk gdisk dosfstools
          rustup toolchain install 1.99.0 --profile minimal --target aarch64-unknown-none-softfloat
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build pinned boot stages, U-Boot and J773g tree
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == aarch64 ]]
          mkdir -p boot-record boot-candidate
          git rev-parse HEAD > boot-record/source-commit.txt
          printf '%s\n' 'Research build/byte and disposable FAT checks only; no installation, authorization or M4 hardware qualification.' > boot-record/STATUS.txt
          git init "$RUNNER_TEMP/bootloader"
          git -C "$RUNNER_TEMP/bootloader" remote add origin https://github.com/GravityLinux/bootloader.git
          git -C "$RUNNER_TEMP/bootloader" fetch --depth=1 origin f02d4a52017915febb222539636b5b025a70407a
          git -C "$RUNNER_TEMP/bootloader" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/bootloader" submodule update --init artwork
          python3 mseries/m4-mini/build-bootloader.py --source "$RUNNER_TEMP/bootloader" \
            --output "$RUNNER_TEMP/stages" --cargo-home "$RUNNER_TEMP/cargo" --jobs 2
          curl --fail --location --retry 4 --proto '=https' --tlsv1.2 \
            https://codeload.github.com/GravityLinux/u-boot/tar.gz/a2f6913694ff26908c16948af3f8372429782263 \
            --output "$RUNNER_TEMP/u-boot.tar.gz"
          python3 mseries/m4-mini/build-uboot.py --archive "$RUNNER_TEMP/u-boot.tar.gz" \
            --output "$RUNNER_TEMP/uboot" --jobs 2
          curl --fail --location --retry 4 --proto '=https' --tlsv1.2 \
            https://codeload.github.com/GravityLinux/linux/tar.gz/4fc326f6c25ccceb7515e2635c22e01fde5d3bac \
            --output "$RUNNER_TEMP/linux.tar.gz"
          python3 mseries/m4-mini/prepare-sources.py --gravity-archive "$RUNNER_TEMP/linux.tar.gz" --output "$RUNNER_TEMP/dt-capture"
          python3 mseries/m4-mini/build-dtb.py --source gravity-mini \
            --capture "$RUNNER_TEMP/dt-capture" --output "$RUNNER_TEMP/dtb"
          python3 mseries/m4-mini/assemble-boot-chain.py --bootloader "$RUNNER_TEMP/stages" \
            --u-boot "$RUNNER_TEMP/uboot/u-boot-nodtb.bin" \
            --dtb "$RUNNER_TEMP/dtb/t8132-j773g.dtb" --output "$RUNNER_TEMP/chain" \
            --bootloader-receipt "$RUNNER_TEMP/stages/receipt.json" --uboot-receipt "$RUNNER_TEMP/uboot/receipt.json"
          python3 mseries/m4-mini/check-boot-esp-fixture.py --bundle "$RUNNER_TEMP/chain/boot.bin" \
            --bundle-receipt "$RUNNER_TEMP/chain/receipt.json" --receipt boot-record/esp-fixture.json
          { rustc --version --verbose; gcc --version; ld --version; dtc --version; } > boot-record/toolchain.txt
          cp "$RUNNER_TEMP/chain/"{boot.bin,m1n1-stage1.bin,receipt.json} boot-candidate/
          cp "$RUNNER_TEMP/linux.tar.gz" boot-candidate/gravity-dt-corresponding-kernel-source.tar.gz
          cp "$RUNNER_TEMP/u-boot.tar.gz" boot-candidate/gravity-uboot-corresponding-source.tar.gz
          tar --exclude=.git --exclude=build -czf boot-candidate/gravity-bootloader-corresponding-source.tar.gz \
            -C "$RUNNER_TEMP" bootloader
          tar --exclude=.git -czf boot-candidate/bootloader-rust-dependencies.tar.gz \
            -C "$RUNNER_TEMP" cargo/registry/src cargo/git/checkouts
          tar -czf boot-candidate/j773g-source-capture.tar.gz -C "$RUNNER_TEMP" dt-capture
          mkdir -p boot-candidate/reproduction/mseries/m4-mini boot-candidate/reproduction/mseries/fairydust/debian
          cp mseries/m4-mini/{build-bootloader,build-uboot,prepare-sources,build-dtb,assemble-boot-chain,check-boot-esp-fixture}.py boot-candidate/reproduction/mseries/m4-mini/
          cp mseries/m4-mini/research.json boot-candidate/reproduction/mseries/m4-mini/
          cp -a mseries/m4-mini/receipts boot-candidate/reproduction/mseries/m4-mini/
          cp mseries/fairydust/debian/verify-m1n1-esp.py boot-candidate/reproduction/mseries/fairydust/debian/
          cp boot-record/{source-commit.txt,STATUS.txt,toolchain.txt,esp-fixture.json} boot-candidate/
          (cd boot-candidate && sha256sum *.bin *.tar.gz > SHA256SUMS)
      - name: Collect boot diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p boot-record
          for component in stages uboot dtb chain; do
            if [[ -d "$RUNNER_TEMP/$component" ]]; then
              mkdir -p "boot-record/$component"
              for file in "$RUNNER_TEMP/$component/"*.log "$RUNNER_TEMP/$component/"*.stderr "$RUNNER_TEMP/$component/"*build_cfg.h "$RUNNER_TEMP/$component/receipt.json"; do
                [[ ! -f "$file" ]] || cp "$file" "boot-record/$component/"
              done
            fi
          done
      - name: Preserve research diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m4-boot-record-${{ github.run_id }}
          path: boot-record/
          retention-days: 7
      - name: Preserve verified research boot candidate and corresponding source
        uses: actions/upload-artifact@v7
        with:
          name: m4-boot-candidate-${{ github.run_id }}
          path: boot-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  build-m4-image:
    if: inputs.m4_image_only
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Validate full-image research selection
        run: |
          set -euo pipefail
          [[ "${{ inputs.fairydust }}" != true && "${{ inputs.fairydust_tunnel }}" != true && "${{ inputs.m4_kernel_only }}" != true && "${{ inputs.m4_userspace_only }}" != true && "${{ inputs.m4_boot_only }}" != true ]]
          [[ "$(uname -m)" == aarch64 ]]
          mkdir -p image-record
          git rev-parse HEAD > image-record/source-commit.txt
          cp mseries/m4-mini/hosted-inputs.json image-record/
          printf '%s\n' 'Full mkosi research graph only. Installer admission and hardware qualification false; ISO assembly and native boot separate.' > image-record/STATUS.txt
      - name: Free disposable image build space
        uses: jlumbroso/free-disk-space@v2
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Install native image and candidate-inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl git gh uidmap bubblewrap \
            systemd-repart systemd-ukify systemd-container cryptsetup-bin \
            python3-packaging python3-pefile python3-cryptography \
            openssl rsync zstd cpio kmod fdisk gdisk dosfstools mtools erofs-utils \
            squashfs-tools xorriso grub-common grub-efi-arm64-bin initramfs-tools-core device-tree-compiler \
            libegl1 libgl1 libvulkan1 libgbm1 libdrm2 libllvm21 \
            libwayland-client0 libwayland-server0 libxcb-dri3-0 libxcb-present0 \
            libxcb-xfixes0 libxshmfence1 libxxf86vm1
      - name: Check signed active-slot export and reserved standby slots
        shell: bash
        run: |
          set -euo pipefail
          sudo env GITHUB_ACTIONS=true python3 mseries/m4-mini/test-repart-standby-split.py --hosted-root \
            --repart "$(command -v systemd-repart)" --output "$RUNNER_TEMP/repart-fixture"
          sudo install -m 0644 "$RUNNER_TEMP/repart-fixture/receipt.json" image-record/repart-fixture.json
      - name: Retrieve successful reviewed hosted components
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          manifest = json.loads(Path('mseries/m4-mini/hosted-inputs.json').read_text())
          assert manifest['schema'] == 1 and set(manifest['components']) == {'kernel', 'mesa', 'boot'}
          command = ['python3', 'mseries/m4-mini/fetch-hosted-candidates.py', '--output', os.environ['RUNNER_TEMP'] + '/retrieved']
          for kind, item in manifest['components'].items():
              command += ['--' + kind + '-run', str(item['run']), '--' + kind + '-source', item['source']]
          subprocess.run(command, check=True)
          PY
          cp "$RUNNER_TEMP/retrieved/provenance.json" image-record/component-provenance.json
      - name: Validate and prepare matched image inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 mseries/m4-mini/prepare-hosted-image-inputs.py \
            --retrieved "$RUNNER_TEMP/retrieved" --output "$RUNNER_TEMP/image-inputs"
          cp "$RUNNER_TEMP/image-inputs/candidate.json" image-record/
          cp -a "$RUNNER_TEMP/image-inputs/records" image-record/input-records
      - name: Select pinned mkosi and execute complete image graph
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --proto '=https' --tlsv1.2 \
            https://codeload.github.com/systemd/mkosi/tar.gz/f7e32882d26e2c5f3daba48e1aff5b411e6b4d92 \
            --output "$RUNNER_TEMP/mkosi.tar.gz"
          echo 'ed3ed857f768fb85139517eec4ea673f25d1a597e87ab7a59420c4c0accce3b5  '"$RUNNER_TEMP/mkosi.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mkosi.tar.gz" -C "$RUNNER_TEMP"
          { df -h; sudo id; } > image-record/environment.txt
          version=$(date -u +%Y%m%d%H%M%S)
          printf '%s\n' "$version" > image-record/image-version.txt
          sudo env GITHUB_ACTIONS=true GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" \
            python3 mseries/m4-mini/build-research-image.py --hosted-root \
            --inputs "$RUNNER_TEMP/image-inputs" \
            --boot-bundle "$RUNNER_TEMP/retrieved/boot/boot.bin" \
            --boot-bundle-receipt "$RUNNER_TEMP/retrieved/boot/receipt.json" \
            --mkosi-source "$RUNNER_TEMP/mkosi-f7e32882d26e2c5f3daba48e1aff5b411e6b4d92" \
            --image-version "$version" --output "$RUNNER_TEMP/full-image" \
            2>&1 | tee image-record/driver.log
      - name: Verify complete desktop payload and configured candidate roots
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat image-record/image-version.txt)
          output="$RUNNER_TEMP/full-image/images"
          sudo python3 mseries/test-image-wiring.py --image-output "$output" | tee image-record/desktop-payload-check.txt
          sudo env GITHUB_ACTIONS=true python3 mseries/m4-mini/check-desktop-root.py --id-map=host-root --kind=factory-base \
            --root "$output/base_${version}" --receipt image-record/base-root-check.json
          sudo env GITHUB_ACTIONS=true python3 mseries/m4-mini/check-desktop-root.py --id-map=host-root --kind=research-live \
            --root "$output/liveiso_${version}" --receipt image-record/live-root-check.json
          sudo env GITHUB_ACTIONS=true python3 mseries/m4-mini/test-factory-retention.py --id-map=host-root --root "$output/liveiso_${version}" \
            --smoke "$RUNNER_TEMP/retrieved/mesa/mesa-software" | tee image-record/live-mesa-retention.txt
      - name: Assemble and read back unpromoted ARM64 research ISO
        shell: bash
        run: |
          set -euo pipefail
          sudo env GITHUB_ACTIONS=true python3 mseries/m4-mini/assemble-research-iso.py \
            --hosted-root --workspace "$RUNNER_TEMP/full-image" --output "$RUNNER_TEMP/research-iso"
          cp "$RUNNER_TEMP/research-iso/receipt.json" image-record/iso-assembly.json
          mkdir -p research-iso
          sudo cp "$RUNNER_TEMP/research-iso/"*.iso research-iso/
          (cd research-iso && sha256sum *.iso > SHA256SUMS)
      - name: Verify actual sysupdate ESP and compress research images
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat image-record/image-version.txt)
          raw="$RUNNER_TEMP/full-image/images/elementary_${version}.raw"
          sudo python3 mseries/fairydust/debian/verify-m1n1-esp.py \
            --image "$raw" --expected "$RUNNER_TEMP/retrieved/boot/boot.bin" \
            | tee image-record/actual-esp-check.txt
          sudo python3 mseries/m4-mini/export-partitions.py --image "$raw" \
            --output "$RUNNER_TEMP/image-gpt-record" --extract 2 --extract 3 --extract 4
          cp "$RUNNER_TEMP/image-gpt-record/manifest.json" image-record/gpt-manifest.json
          python3 mseries/m4-mini/verify-exported-verity.py \
            --export "$RUNNER_TEMP/image-gpt-record" --output "$RUNNER_TEMP/image-verity-check"
          cp "$RUNNER_TEMP/image-verity-check/receipt.json" image-record/actual-verity-check.json
          mkdir -p research-images
          for image in "$RUNNER_TEMP/full-image/images/"*.raw; do
            [[ ! -f "$image" ]] || sudo zstd -T2 -3 -c "$image" > "research-images/$(basename "$image").zst"
          done
          (cd research-images && sha256sum *.raw.zst > SHA256SUMS)
          cp "$RUNNER_TEMP/retrieved/boot/"*.tar.gz research-images/
          cp "$RUNNER_TEMP/image-inputs/"*.tar.gz research-images/
          cp "$RUNNER_TEMP/mkosi.tar.gz" research-images/mkosi-corresponding-source.tar.gz
          (cd research-images && sha256sum *.tar.gz > SOURCE-SHA256SUMS)
      - name: Collect full-image diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p image-record
          for file in "$RUNNER_TEMP/full-image/"*.log "$RUNNER_TEMP/full-image/"*.json "$RUNNER_TEMP/full-image/"*.patch; do
            [[ ! -f "$file" ]] || cp "$file" image-record/
          done
          if [[ -d "$RUNNER_TEMP/repart-fixture" ]]; then
            mkdir -p image-record/repart-fixture
            # Export only public diagnostics; the root-owned fixture key stays private.
            for name in default-spares.log no-spare-splits.log; do
              file="$RUNNER_TEMP/repart-fixture/$name"
              if sudo test -f "$file"; then
                sudo install -m 0644 "$file" "image-record/repart-fixture/$name"
              fi
            done
          fi
          if [[ -f "$RUNNER_TEMP/image-verity-check/commands.log" ]]; then
            cp "$RUNNER_TEMP/image-verity-check/commands.log" image-record/actual-verity-commands.log
          fi
          df -h > image-record/final-disk-space.txt
          if [[ -d "$RUNNER_TEMP/research-iso" ]]; then
            mkdir -p image-record/iso-logs
            sudo find "$RUNNER_TEMP/research-iso" -maxdepth 1 -type f \( -name '*.log' -o -name '*.json' -o -name INCOMPLETE \) \
              -exec cp -t image-record/iso-logs {} +
          fi
      - name: Preserve full-image research records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m4-image-record-${{ github.run_id }}
          path: image-record/
          retention-days: 7
      - name: Preserve unpromoted research raw images and corresponding source
        uses: actions/upload-artifact@v7
        with:
          name: m4-image-candidate-${{ github.run_id }}
          path: research-images/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
      - name: Preserve unpromoted ARM64 research ISO
        uses: actions/upload-artifact@v7
        with:
          name: m4-iso-candidate-${{ github.run_id }}
          path: research-iso/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
