name: Frozen paths guard

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'rust/**'
      - 'mseries/**'
      - '.github/workflows/frozen-paths.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    name: Reject edits to frozen app copies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Guard tests
        run: python3 -B -m unittest discover -s mseries/ci -p 'test_check_frozen.py' -v
      - name: Check changed paths against mseries/ci/frozen-paths.txt
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          ALLOW: ${{ contains(github.event.pull_request.labels.*.name, 'allow-frozen-edit') && '--allow' || '' }}
        run: python3 mseries/ci/check_frozen.py $ALLOW "$BASE" "$HEAD"
