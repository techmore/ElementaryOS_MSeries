# Opt-in experimental Fairydust + Apple USB4 kernel for M-series VM testing.
# Requires the locally built packages in mkosi.packages/ (see README).
[Match]
Architecture=arm64

[Content]
Packages=
    linux-image-7.1.13-elementary-fairydust-usb4=7.1.13+elementary.usb4.3
    m1n1=1.5.2-2ubuntu0.1~asahi1
    u-boot-asahi=2025.10-2-1
