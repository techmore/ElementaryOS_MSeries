# Automatically selected for arm64, including the ordinary daily build.
# Architecture-named mkosi.profiles directories are opt-in, not automatic.
[Match]
Architecture=arm64

[Config]
Dependencies=apple-silicon

[Content]
Packages=
    dconf-cli
    gnome-settings-daemon-common
    power-profiles-daemon
    pulseaudio-utils
    wireplumber
    systemd-zram-generator
    gir1.2-glib-2.0
    curl
    ca-certificates
    python3
    unzip
    procps
    qml6-module-qtquick
    qml6-module-qtquick-controls
    qml6-module-qtquick-layouts
    qml6-module-qtquick-templates
    qml6-module-qtquick-window
    qml6-module-qtqml-workerscript
    libqt6widgets6
    libqt6svg6
    qt6-wayland
    xdg-terminal-exec
    grub-efi-arm64-signed
    io.elementary.panel.network
    io.elementary.quick-settings
    pipewire-pulse
    pipewire-alsa
    rtkit
    python3-gi
ExtraTrees=%O/apple-silicon_%a-%v
