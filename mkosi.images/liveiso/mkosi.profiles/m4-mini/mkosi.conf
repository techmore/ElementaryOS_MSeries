# Keep the ordinary live-ISO drivers and add the matched Apple boot/input path.
[Assert]
Architecture=arm64

[Content]
# Live runtime from elementary-live 1.582+r657, without foreign boards or installer.
Packages=
    apparmor-profiles
    casper
    cifs-utils
    discover
    distinst
    expect
    gparted
    os-prober
    wamerican
    xfsprogs
PostInstallationScripts=%C/prepare-live-kernel.chroot
KernelInitrdModules=
    nvme_apple
    pcie_apple
    hid_apple
    hid_magicmouse
