# Keep the ordinary live-ISO drivers and add the matched Apple boot/input path.
[Assert]
Architecture=arm64

[Content]
# Common dependencies from elementary-live 1.582+r657; omit X13s/X1E settings.
Packages=
    apparmor-profiles
    casper
    cifs-utils
    discover
    distinst
    expect
    gparted
    io.elementary.installer
    os-prober
    wamerican
    xfsprogs
PostInstallationScripts=%C/prepare-live-kernel.chroot
KernelInitrdModules=
    nvme_apple
    pcie_apple
    hid_apple
    hid_magicmouse
