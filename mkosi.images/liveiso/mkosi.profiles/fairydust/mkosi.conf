# Preserve the ordinary installer initrd modules while ensuring Apple input
# devices initialize before boot-unlock/installer UI.
[Match]
Architecture=arm64

[Content]
KernelInitrdModules=
    default
    ahci
    nvme
    xhci_pci
    usb_storage
    uas
    sd_mod
    sr_mod
    isofs
    loop
    ext4
    hid_apple
    hid_magicmouse
