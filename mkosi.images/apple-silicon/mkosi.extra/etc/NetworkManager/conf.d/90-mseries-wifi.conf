# Apple Silicon Broadcom Wi-Fi: make joining open (and any) networks work out of the box.
# Random MAC during scans makes brcmfmac scans fail or hide networks, and a randomised
# MAC per connection breaks open networks that gate access by MAC (captive portals).
[device]
wifi.scan-rand-mac-address=no

[connection]
wifi.cloned-mac-address=preserve
