# Apple Silicon (Asahi): early-load HID drivers so the internal keyboard and
# trackpad bind correctly on first registration (ported from omarchy-mac
# install/hardware/apple/fix-asahi-hid-race.sh, which uses mkinitcpio;
# Ubuntu uses initramfs-tools, where /etc/initramfs-tools/modules lists
# modules for the initramfs — one per line. The apple-silicon image appends
# these via mkosi.postinst.chroot (modules.d support is version-dependent,
# so this drop-in ships as documentation/fallback).
#
# Background: dockchannel-hid devices first bind hid-generic, then get
# destroyed/re-created once hid_apple/hid_magicmouse load; the churn
# reshuffles /dev/input/eventN minors while logind and the compositor start,
# and on unlucky boots the trackpad stays dead all session. Early loading
# removes the churn. Full analysis: omarchy-mac docs/apple-silicon-trackpad.md.
hid_apple
hid_magicmouse
