#apple-silicon — Apple Silicon (M-series) hardware support layer.
# Experimental: additive overlay consumed via ExtraTrees by the arm64
# liveiso profile and the sysupdate image. See mseries/BUILD-NOTES.md and
# mseries/KERNEL-REPORT.md. Only builds on arm64 (see [Match] below), so
# x86-64 builds are unaffected.
[Config]
Dependencies=base

[Match]
Architecture=arm64

[Output]
ImageId=apple-silicon
Format=directory
SplitArtifacts=
CompressOutput=false
Output=apple-silicon_%a-%v

[Content]
Bootable=no
BuildPackages=
    build-essential
    cmake
    libva-dev
    libdrm-dev
    linux-libc-dev
    libinput-dev
    libudev-dev
    libpugixml-dev
    libcairo2-dev
    libgtk-3-dev
    libx11-dev
    libxtst-dev
    libxrandr-dev
    libxi-dev
    libsystemd-dev
    systemd-dev
    gettext
    git
    libgranite-7-dev
    libgtk-4-dev
    libadwaita-1-dev
    libnm-dev
    libnma-gtk4-dev
    libpolkit-gobject-1-dev
    libsqlite3-dev
    libwingpanel-9-dev
    meson
    ninja-build
    pkg-config
    valac
BuildScripts=build-network-indicator build-quick-settings build-touchegg build-video-decode
Packages=
    libva2
    libva-drm2
    libdrm2
    vainfo
    libinput10
    libudev1
    libpugixml1v5
    libcairo2
    libgtk-3-0t64
    libx11-6
    libxtst6
    libxrandr2
    libxi6
    libglib2.0-0t64
    libstdc++6
    dconf-cli
    gnome-settings-daemon-common
    power-profiles-daemon
    pulseaudio-utils
    wireplumber
    systemd-zram-generator
    gir1.2-glib-2.0
    curl
    ca-certificates
    python3
    unzip
    procps
    qml6-module-qtquick
    qml6-module-qtquick-controls
    qml6-module-qtquick-layouts
    qml6-module-qtquick-templates
    qml6-module-qtquick-window
    qml6-module-qtqml-workerscript
    libqt6widgets6
    libqt6svg6
    qt6-wayland
    xdg-terminal-exec
    io.elementary.panel.network
    io.elementary.quick-settings
    pipewire-pulse
    pipewire-alsa
    rtkit
    initramfs-tools
    python3-gi
