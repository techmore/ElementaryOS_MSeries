#apple-silicon — Apple Silicon (M-series) hardware support layer.
# Experimental: additive overlay consumed via ExtraTrees by the arm64
# liveiso profile and the sysupdate image. See mseries/BUILD-NOTES.md and
# mseries/KERNEL-REPORT.md. Only builds on arm64 (see [Match] below), so
# x86-64 builds are unaffected.
[Config]
Dependencies=base

[Match]
Architecture=arm64

[Output]
ImageId=apple-silicon
Format=directory
SplitArtifacts=
CompressOutput=false
Output=apple-silicon_%a-%v

[Content]
Bootable=no
BuildPackages=
    build-essential
    gettext
    git
    libgranite-7-dev
    libgtk-4-dev
    libadwaita-1-dev
    libnm-dev
    libnma-gtk4-dev
    libpolkit-gobject-1-dev
    libsqlite3-dev
    libwingpanel-9-dev
    meson
    ninja-build
    pkg-config
    valac
BuildScripts=build-network-indicator build-quick-settings
Packages=
    dconf-cli
    gnome-settings-daemon-common
    power-profiles-daemon
    pulseaudio-utils
    wireplumber
    systemd-zram-generator
    gir1.2-glib-2.0
    curl
    ca-certificates
    python3
    unzip
    procps
    qml6-module-qtquick
    qml6-module-qtquick-controls
    qml6-module-qtquick-layouts
    qml6-module-qtquick-templates
    qml6-module-qtquick-window
    qml6-module-qtqml-workerscript
    libqt6widgets6
    libqt6svg6
    qt6-wayland
    xdg-terminal-exec
    io.elementary.panel.network
    io.elementary.quick-settings
    pipewire-pulse
    pipewire-alsa
    rtkit
    initramfs-tools
    python3-gi
