# M-series: Apple Silicon support for the installed system (arm64 only).
# ExtraTrees overlays the apple-silicon image onto the usr partition, same
# pattern as modules-db above in ../mkosi.conf. The KernelInitrdModules list
# repeats the base list from ../mkosi.conf plus Apple HID drivers (needed for
# disk-unlock keyboards on Apple keyboards); keep in sync with ../mkosi.conf
# if upstream changes it. If the first arm64 build errors on a missing
# module here, drop that line and record the generic kernel's Apple config.
[Match]
Architecture=arm64

[Config]
Dependencies=apple-silicon

[Content]
Packages=
    dconf-cli
    gnome-settings-daemon-common
    power-profiles-daemon
    pulseaudio-utils
    wireplumber
    systemd-zram-generator
    gir1.2-glib-2.0
    curl
    ca-certificates
    python3
    unzip
    procps
    qml6-module-qtquick
    qml6-module-qtquick-controls
    qml6-module-qtquick-layouts
    qml6-module-qtquick-templates
    qml6-module-qtquick-window
    qml6-module-qtqml-workerscript
    libqt6widgets6
    libqt6svg6
    qt6-wayland
    xdg-terminal-exec
    io.elementary.panel.network
    io.elementary.quick-settings
    pipewire-pulse
    pipewire-alsa
    rtkit
    python3-gi
ExtraTrees=%O/apple-silicon_%a-%v
KernelInitrdModules=
    default
    ahci
    nvme
    xhci_pci
    usb_storage
    uas
    sd_mod
    dm-verity
    hid_apple
    hid_magicmouse
