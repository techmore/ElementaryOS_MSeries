[package]
name = "remote-core"
description = "Protocol, pairing/consent, input validation, capture and H.264 encode for the M-Series WebRTC remote desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
hmac = "0.12"
openh264 = "0.9"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tracing = "0.1"
