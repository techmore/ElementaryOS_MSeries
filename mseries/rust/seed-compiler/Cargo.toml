[package]
name = "elementary-seed-compiler"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Independent Rust seed and Debian package resolver candidate for Elementary"

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
md-5 = "=0.10.6"

[[bin]]
name = "elementary-seed-compiler"
path = "src/main.rs"
