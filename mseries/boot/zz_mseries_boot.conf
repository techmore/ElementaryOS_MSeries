# mkinitcpio drop-in for the Apple Silicon (Omarchy/Arch) side that boots both
# Omarchy and elementary. Sourced after omarchy_hooks.conf.
#
# apple-dcp defers its probe until mux-apple-display-crossbar ("dp-xbar") is
# available. Without it in the initramfs the kernel waits out its 10 second
# deferred-probe timeout on every boot. Add it only where the kernel builds it,
# since mkinitcpio fails the whole image over a MODULES entry it cannot find.
if modinfo -k "${KERNELVERSION:-$(uname -r)}" mux_apple_display_crossbar >/dev/null 2>&1; then
  MODULES+=(mux_apple_display_crossbar)
fi
