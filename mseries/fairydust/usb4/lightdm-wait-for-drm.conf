# Wait for the Apple display driver (appledrm/DCP) to expose the built-in panel before starting
# the greeter. Without this, the greeter's gala starts before /dev/dri/card2 exists and aborts
# (SIGABRT) the moment the display appears; its portal helper then wedges and the replacement
# greeter waits out D-Bus' 120 s activation timeout (login screen appears ~2 min late).
# Bounded at 30 s so a headless/failed display never blocks login. Remove this file to revert.
[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ "$i" -lt 150 ]; do for d in /sys/class/drm/card*-eDP-*; do [ -e "$d" ] && exit 0; done; i=$((i+1)); sleep 0.2; done; exit 0'
TimeoutStartSec=60
