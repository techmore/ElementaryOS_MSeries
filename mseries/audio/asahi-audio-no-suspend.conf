# MSeries change 2026-10-14: the idle timeout is 30 s, not never. With the original value 0 the
# speaker stream stayed RUNNING with nothing playing and the M1 Pro drew about 12.9 W on battery;
# with 30 s the stream closed and it drew 11.7 W (about 1.2 W less). The cost is a possible pop
# after more than 30 s of silence. Set it to 0 for the Omarchy behaviour (no pops, higher drain).
#
# Keep the Apple Silicon speaker and headphone outputs open between streams.
# PipeWire suspends an idle sink after five seconds, which powers down the
# speaker amplifiers; reopening powers them back up with an audible pop on
# every start and stop of playback.
# Matched by ALSA path because asahi-audio renames the speaker node and hides it
# behind the per-model filter chain. Device 1 is the speaker array and device 0
# the headphone jack on every AppleJ model; capture nodes still suspend.
#
# Ported from omarchy-mac-pkgs (omarchy-mac/share/wireplumber/wireplumber.conf.d/
# asahi-audio-no-suspend.conf, commit 222f7a8).
monitor.alsa.rules = [
  {
    matches = [
      { api.alsa.path = "~hw:AppleJ[0-9][0-9][0-9],[01]", media.class = "Audio/Sink" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 30
      }
    }
  }
]
