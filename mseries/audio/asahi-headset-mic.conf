# The 3.5mm headset mic stays in the source list with nothing plugged in. Apps
# often pick it over the built-in array because it advertises a MONO map.
#
# Ported from omarchy-mac-pkgs (omarchy-mac/share/wireplumber/wireplumber.conf.d/
# asahi-headset-mic.conf, commit 222f7a8).
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_input.platform-sound.HiFi__Headset__source" }
    ]
    actions = {
      update-props = {
        priority.session = 1
      }
    }
  }
]
