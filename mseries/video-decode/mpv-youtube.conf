# Best-quality, hardware-decoded YouTube on the M-series (Apple AVD through the v4l2-request VA-API driver).
# Not auto-installed. Try:  mpv --include=/path/to/mpv-youtube.conf 'https://www.youtube.com/watch?v=...'
# or copy to ~/.config/mpv/mpv.conf (only if you have none).
# Hardware decode here covers H.264, HEVC Main/Main10 and VP9 profile 0 (vainfo, 2026-10-18); not AV1.
hwdec=vaapi-copy
hwdec-codecs=h264,hevc,vp9
vo=gpu-next
gpu-api=vulkan
# prefer VP9/H.264 (hardware) over AV1 (software); take the highest bitrate stream of that codec
ytdl-format=bestvideo[vcodec~='^vp0?9'][height<=2160]+bestaudio/bestvideo[vcodec^=avc1][height<=2160]+bestaudio/bestvideo+bestaudio
video-sync=display-resample
interpolation=no
