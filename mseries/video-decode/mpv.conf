# mpv defaults for the M-series port: hardware decode on the Apple Video Decoder (AVD) through the
# libva v4l2-request bridge, for local files and for YouTube (yt-dlp). Installed to ~/.config/mpv/mpv.conf by
# mseries/install-video-playback.sh only when you have no mpv.conf of your own.
#
# AVD covers H.264, HEVC Main/Main10 and VP9 profile 0/2 (vainfo 2026-10-18). AV1, VP8, MPEG-2 and anything
# else are software-decoded. mpv falls back to software by itself if the hardware path fails to start.
# vaapi-copy downloads each decoded frame into system memory (one extra copy, works with every output);
# see README.md for the zero-copy measurement before switching to hwdec=vaapi.
hwdec=vaapi-copy
hwdec-codecs=h264,hevc,vp9
vo=gpu-next
# Prefer VP9/H.264 (hardware) over AV1 (software) when playing YouTube URLs, highest bitrate of that codec.
ytdl-format=bestvideo[vcodec~='^vp0?9'][height<=2160]+bestaudio/bestvideo[vcodec^=avc1][height<=2160]+bestaudio/bestvideo+bestaudio
