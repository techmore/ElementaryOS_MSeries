# Use the full Apple Silicon display height, including the strip beside the
# notch (ported from omarchy-mac install/hardware/apple/enable-notch.sh).
# Only takes effect where the appledrm display driver exists (Apple Silicon);
# inert elsewhere. Installed by the future apple-silicon mkosi image to
# /etc/modprobe.d/.
options appledrm show_notch=1
